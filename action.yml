name: PR Sentinel
description: AI code review for pull requests - inline comments plus a PR summary
author: Krinal Gami
branding:
  icon: shield
  color: blue

inputs:
  groq-api-key:
    description: Groq API key (store it as a repository secret)
    required: true
  github-token:
    description: Token used to read the PR and post the review
    default: ${{ github.token }}
  model:
    description: LLM model name
    default: llama-3.3-70b-versatile
  min-severity:
    description: Lowest severity to comment on (low, medium, high, critical)
    default: low
  enable-rag:
    description: Use repository-aware context (slower first run, better reviews)
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ${{ github.action_path }}/requirements.txt

    - name: Install PR Sentinel
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Review pull request
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        LLM_MODEL: ${{ inputs.model }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        ENABLE_RAG: ${{ inputs.enable-rag }}
      run: python -m pr_sentinel.cli
